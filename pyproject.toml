[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pixiechess-client"
version = "0.1.3"
description = "Unofficial async Python client for the PixieChess API"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
keywords = ["pixiechess", "api-client", "async"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pixiechess_client"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
    "ty>=0.0.1",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]

[tool.ruff.lint.isort]
known-first-party = ["pixiechess_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "live: hits api.pixiechess.xyz; skipped by default — run with `-m live`",
]
addopts = "-m 'not live'"
